<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Subtitles 2 — Bolzi Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #2a2a2a;
    --border-bright: #3a3a3a;
    --accent: #e8ff47;
    --accent-dim: rgba(232, 255, 71, 0.12);
    --accent-dim2: rgba(232, 255, 71, 0.06);
    --text: #f0f0f0;
    --text-muted: #888;
    --text-dim: #555;
    --red: #ff4444;
    --green: #44ff88;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 4rem;
  }

  /* back link */
  .back {
    position: fixed;
    top: 1.25rem;
    left: 1.5rem;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: color 0.2s;
    z-index: 10;
  }
  .back:hover { color: var(--accent); }

  /* header */
  header {
    text-align: center;
    margin-bottom: 3rem;
    max-width: 560px;
  }

  .tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 1rem;
    text-transform: uppercase;
  }

  h1 {
    font-family: var(--mono);
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 0.75rem;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
    font-weight: 300;
  }

  /* main card */
  .card {
    width: 100%;
    max-width: 660px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .card-top {
    padding: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  /* input group */
  .input-group {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .url-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    min-width: 0;
  }
  .url-input::placeholder { color: var(--text-dim); }
  .url-input:focus {
    border-color: var(--accent);
    background: var(--accent-dim2);
  }

  .btn-extract {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 0.75rem 1.25rem;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s, transform 0.1s;
    text-transform: uppercase;
  }
  .btn-extract:hover { opacity: 0.88; }
  .btn-extract:active { transform: scale(0.97); }
  .btn-extract:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  /* lang row */
  .lang-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }

  .lang-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .lang-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .lang-chip {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border-bright);
    color: var(--text-muted);
    background: transparent;
    cursor: pointer;
    transition: all 0.15s;
  }
  .lang-chip:hover { border-color: var(--accent); color: var(--accent); }
  .lang-chip.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* stato */
  .status-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  .status-bar.visible { display: flex; }
  .status-bar.loading { color: var(--text-muted); }
  .status-bar.success { color: var(--green); }
  .status-bar.error { color: var(--red); }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  .loading .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }

  /* meta info */
  .meta {
    display: none;
    gap: 1rem;
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--accent-dim2);
    flex-wrap: wrap;
  }
  .meta.visible { display: flex; }
  .meta-item {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
  }
  .meta-item span { color: var(--text-dim); }
  .meta-item strong { color: var(--accent); }

  /* output */
  .output-area {
    display: none;
    flex-direction: column;
  }
  .output-area.visible { display: flex; }

  .output-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .output-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .action-btns { display: flex; gap: 8px; }

  .btn-action {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border-bright);
    color: var(--text-muted);
    background: transparent;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }
  .btn-action:hover { border-color: var(--accent); color: var(--accent); }
  .btn-action.copied {
    background: rgba(68, 255, 136, 0.1);
    border-color: var(--green);
    color: var(--green);
  }

  textarea.transcript {
    width: 100%;
    min-height: 320px;
    background: transparent;
    border: none;
    padding: 1.25rem 1.5rem;
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    resize: vertical;
    outline: none;
  }

  /* empty state */
  .empty-state {
    padding: 3rem 1.5rem;
    text-align: center;
  }

  .empty-icon {
    font-size: 2rem;
    margin-bottom: 1rem;
    opacity: 0.3;
  }

  .empty-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  /* footer */
  footer {
    margin-top: 2.5rem;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-align: center;
  }
  footer a { color: var(--text-dim); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  @media (max-width: 480px) {
    .input-group { flex-direction: column; }
    .btn-extract { width: 100%; }
  }
</style>
</head>
<body>

<a href="/" class="back">← Bolzi Lab</a>

<header>
  <div class="tag">🛠 Tool</div>
  <h1>YT <span>Subtitles</span></h1>
  <p class="subtitle">Incolla un URL YouTube. I sottotitoli vengono estratti e copiati in clipboard. Zero click inutili.</p>
</header>

<div class="card">
  <div class="card-top">
    <div class="input-group">
      <input
        type="text"
        class="url-input"
        id="urlInput"
        placeholder="https://youtube.com/watch?v=..."
        autocomplete="off"
        spellcheck="false"
      />
      <button class="btn-extract" id="extractBtn">Extract →</button>
    </div>
    <div class="lang-row">
      <span class="lang-label">Lingua:</span>
      <div class="lang-chips" id="langChips">
        <button class="lang-chip active" data-lang="it">IT</button>
        <button class="lang-chip" data-lang="en">EN</button>
        <button class="lang-chip" data-lang="it,en">IT+EN</button>
        <button class="lang-chip" data-lang="en,it">EN+IT</button>
      </div>
    </div>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="dot"></div>
    <span id="statusText"></span>
  </div>

  <div class="meta" id="metaBar">
    <div class="meta-item"><span>Video: </span><strong id="metaId">—</strong></div>
    <div class="meta-item"><span>Lingua: </span><strong id="metaLang">—</strong></div>
    <div class="meta-item"><span>Tipo: </span><strong id="metaType">—</strong></div>
    <div class="meta-item"><span>Snippet: </span><strong id="metaCount">—</strong></div>
  </div>

  <div id="emptyState" class="empty-state">
    <div class="empty-icon">📋</div>
    <p class="empty-text">Il transcript apparirà qui</p>
  </div>

  <div class="output-area" id="outputArea">
    <div class="output-actions">
      <span class="output-label">Transcript</span>
      <div class="action-btns">
        <button class="btn-action" id="copyBtn">Copia</button>
        <button class="btn-action" id="clearBtn">Pulisci</button>
      </div>
    </div>
    <textarea class="transcript" id="transcriptOutput" readonly></textarea>
  </div>
</div>

<footer>
  Made with ☕ — <a href="/">Bolzi Lab</a> © 2026
</footer>

<script>
  const API_BASE = '/api/transcript';

  const urlInput = document.getElementById('urlInput');
  const extractBtn = document.getElementById('extractBtn');
  const statusBar = document.getElementById('statusBar');
  const statusText = document.getElementById('statusText');
  const metaBar = document.getElementById('metaBar');
  const outputArea = document.getElementById('outputArea');
  const emptyState = document.getElementById('emptyState');
  const transcriptOutput = document.getElementById('transcriptOutput');
  const copyBtn = document.getElementById('copyBtn');
  const clearBtn = document.getElementById('clearBtn');
  const langChips = document.querySelectorAll('.lang-chip');

  let selectedLang = 'it';

  // Lang chip selection
  langChips.forEach(chip => {
    chip.addEventListener('click', () => {
      langChips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      selectedLang = chip.dataset.lang;
    });
  });

  // Auto-extract on paste
  urlInput.addEventListener('paste', () => {
    setTimeout(() => {
      if (urlInput.value.includes('youtube.com') || urlInput.value.includes('youtu.be')) {
        extract();
      }
    }, 50);
  });

  urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') extract();
  });

  extractBtn.addEventListener('click', extract);

  async function extract() {
    const url = urlInput.value.trim();
    if (!url) {
      setStatus('error', 'Inserisci un URL YouTube');
      return;
    }

    setStatus('loading', 'Estrazione in corso...');
    extractBtn.disabled = true;
    hideOutput();

    try {
      const params = new URLSearchParams({ url, lang: selectedLang });
      const res = await fetch(`${API_BASE}?${params}`);
      const text = await res.text();
      console.log(text);

      const data = JSON.parse(text);

      if (!res.ok) {
        setStatus('error', data.error || 'Errore sconosciuto');
        return;
      }

      // Meta
      document.getElementById('metaId').textContent = data.video_id;
      document.getElementById('metaLang').textContent = data.language;
      const transcriptType = data.is_generated === true
        ? 'Auto-generato'
        : data.is_generated === false
          ? 'Manuale'
          : 'Disponibile';
      document.getElementById('metaType').textContent = transcriptType;
      document.getElementById('metaCount').textContent = data.snippet_count;
      metaBar.classList.add('visible');

      // Output
      transcriptOutput.value = data.text;
      emptyState.style.display = 'none';
      outputArea.classList.add('visible');

      // Auto-copy
      await copyToClipboard(data.text);
      setStatus('success', `✓ Copiato in clipboard — ${data.snippet_count} snippet`);

   catch (err) {
     console.error(err);
     setStatus('error', err.message);
    } finally {
      extractBtn.disabled = false;
    }
  }

  function setStatus(type, msg) {
    statusBar.className = `status-bar visible ${type}`;
    statusText.textContent = msg;
  }

  function hideOutput() {
    metaBar.classList.remove('visible');
    outputArea.classList.remove('visible');
    emptyState.style.display = '';
  }

  copyBtn.addEventListener('click', async () => {
    if (!transcriptOutput.value) return;
    await copyToClipboard(transcriptOutput.value);
    copyBtn.textContent = '✓ Copiato!';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Copia';
      copyBtn.classList.remove('copied');
    }, 2000);
  });

  clearBtn.addEventListener('click', () => {
    urlInput.value = '';
    transcriptOutput.value = '';
    hideOutput();
    statusBar.className = 'status-bar';
    urlInput.focus();
  });

  async function copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // Fallback per browser che non supportano clipboard API
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  }
</script>
</body>
</html>
